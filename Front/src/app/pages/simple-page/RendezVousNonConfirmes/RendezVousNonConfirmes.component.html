<div class="container mt-4">
  <h2 class="mb-4 text-center">📅 Rendez-vous non confirmés</h2>

  <!-- Calendrier au-dessus du formulaire, sans fond blanc -->
  <div class="d-flex justify-content-start mb-4">
    <div class="mini-calendar-wrapper" style="max-width: 220px;">
      <h5 class="mb-2">📅 Calendrier</h5>
      <div class="mini-calendar">
        <div class="mc-header mb-2 d-flex justify-content-between">
          <select class="mc-select" [(ngModel)]="calMonth" (change)="buildCalendar()">
            <option *ngFor="let m of monthNames; let i=index" [ngValue]="i">{{ m }}</option>
          </select>
          <select class="mc-select" [(ngModel)]="calYear" (change)="buildCalendar()">
            <option *ngFor="let y of yearRange" [value]="y">{{ y }}</option>
          </select>
        </div>

        <div class="mc-weekdays d-flex">
          <div *ngFor="let wd of weekdayNames" class="mc-wd flex-fill text-center">{{ wd }}</div>
        </div>

        <div class="mc-weeks">
          <div class="mc-week d-flex mb-1" *ngFor="let week of calendarWeeks">
            <button class="mc-day flex-fill btn btn-light me-1"
                    *ngFor="let day of week"
                    [class.empty]="!day"
                    [class.today]="day && isToday(day)"
                    [class.selected]="day && selectedDate === formatDate(day)"
                    (click)="selectCalendarDate(day)"
                    [disabled]="!day">
              {{ day ? day.getDate() : '' }}
            </button>
          </div>
        </div>

        <div class="mc-footer mt-2 d-flex justify-content-between">
          <button class="btn btn-sm btn-primary" (click)="showTodayRendezVous()">Rendez-vous du jour</button>
          <button class="btn btn-sm btn-outline-secondary" type="button" (click)="resetFilters()">Réinitialiser</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Formulaire ajout -->
  <div class="card mb-4 shadow-sm rounded-3">
    <div class="card-header bg-light">
      <h5 class="mb-0">➕ Ajouter un rendez-vous</h5>
    </div>
    <div class="card-body">
      <form #addForm="ngForm" (ngSubmit)="create()" novalidate>
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label">ID *</label>
            <input type="number" class="form-control" name="id" [(ngModel)]="newRendezVous.id" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Patient *</label>
            <input type="number" class="form-control" name="idDimPatient" [(ngModel)]="newRendezVous.idDimPatient" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Date prévisionnelle *</label>
            <input type="date" class="form-control" name="datePrevisionnelle" [(ngModel)]="newRendezVous.datePrevisionnelle" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Heure prévisionnelle *</label>
            <input type="time" class="form-control" name="heurePrevisionnelle" [(ngModel)]="newRendezVous.heurePrevisionnelle" required>
          </div>
        </div>

        <div class="row g-3 mt-2">
          <div class="col-md-12">
            <label class="form-label">Commentaires</label>
            <input type="text" class="form-control" name="commentaires" [(ngModel)]="newRendezVous.commentaires">
          </div>
        </div>

        <div class="mt-3 text-end">
          <button type="submit" class="btn btn-success" [disabled]="addForm.invalid">Ajouter</button>
          <button type="button" class="btn btn-outline-secondary ms-2" (click)="resetAddForm(addForm)">Réinitialiser</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Liste RDV sous forme de cartes -->
  <div class="row">
    <div class="col-md-4 mb-3" *ngFor="let rdv of filteredRendezVous">
      <div class="card shadow-sm p-3 h-100">
        <h5 class="card-title">Rendez-vous #{{ rdv.idFactPriseRendezVous }} - Patient #{{ rdv.idDimPatient }}</h5>
        <p><b>Date :</b> {{ rdv.datePrevisionnelle }}</p>
        <p><b>Heure :</b> {{ rdv.heurePrevisionnelle }}</p>
        <p><b>Commentaires :</b> {{ rdv.commentaires || '-' }}</p>
        <div class="d-flex justify-content-between mt-2">
          <button class="btn btn-warning btn-sm" (click)="edit(rdv)">Modifier</button>
          <button class="btn btn-danger btn-sm" (click)="confirmDelete(rdv.idFactPriseRendezVous)">Supprimer</button>
        </div>
      </div>
    </div>
  </div>
</div>
