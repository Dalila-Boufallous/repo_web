<div class="container mt-4">
  <h2 class="mb-4 text-center">📅 Rendez-vous non confirmés</h2>

  <!-- Calendrier au-dessus du formulaire, sans fond blanc -->
  <!-- Calendrier et formulaire de rappel côte à côte -->
<div class="d-flex justify-content-start align-items-start mb-4">

  <!-- 🗓️ Calendrier -->
  <div class="mini-calendar-wrapper me-4" style="max-width: 220px;">
    <h5 class="mb-2">📅 Calendrier</h5>
    <div class="mini-calendar">
      <div class="mc-header mb-2 d-flex justify-content-between">
        <select class="mc-select" [(ngModel)]="calMonth" (change)="buildCalendar()">
          <option *ngFor="let m of monthNames; let i=index" [ngValue]="i">{{ m }}</option>
        </select>
        <select class="mc-select" [(ngModel)]="calYear" (change)="buildCalendar()">
          <option *ngFor="let y of yearRange" [value]="y">{{ y }}</option>
        </select>
      </div>

      <div class="mc-weekdays d-flex">
        <div *ngFor="let wd of weekdayNames" class="mc-wd flex-fill text-center">{{ wd }}</div>
      </div>

      <div class="mc-weeks">
        <div class="mc-week d-flex mb-1" *ngFor="let week of calendarWeeks">
          <button class="mc-day flex-fill btn btn-light me-1"
                  *ngFor="let day of week"
                  [class.empty]="!day"
                  [class.today]="day && isToday(day)"
                  [class.selected]="day && selectedDate === formatDate(day)"
                  (click)="selectCalendarDate(day)"
                  [disabled]="!day">
            {{ day ? day.getDate() : '' }}
          </button>
        </div>
      </div>

      <div class="mc-footer mt-2 d-flex justify-content-between">
        <button class="btn btn-sm btn-primary" (click)="showTodayRendezVous()">Rendez-vous du jour</button>
        <button class="btn btn-sm btn-outline-secondary" type="button" (click)="resetFilters()">Réinitialiser</button>
      </div>
    </div>
  </div>
   <div class="row g-2 mb-3">
  <!-- Recherche globale (tous champs) -->
  <div class="col-md-4">
    <input
      type="text"
      class="form-control"
      placeholder="🔎 Rechercher (tous champs)…"
      [(ngModel)]="searchRdv"
      (input)="applyFilters()"
      [ngModelOptions]="{standalone: true}" />
  </div>

  <!-- Filtre par ID patient (préfixe) -->
  <div class="col-md-4">
    <input
      type="text"
      inputmode="numeric"
      pattern="[0-9, ]*"
      class="form-control"
      placeholder="👤 ID(s) patient (ex: 12 ou 12, 34)"
      [(ngModel)]="patientIdQuery"
      (input)="applyFilters()"
      [ngModelOptions]="{standalone: true}" />
  </div>

  <!-- Filtre par ID rendez-vous (préfixe) -->
  <div class="col-md-4">
    <input
      type="text"
      inputmode="numeric"
      pattern="[0-9, ]*"
      class="form-control"
      placeholder="📅 ID(s) RDV (ex: 10 ou 10, 101)"
      [(ngModel)]="rdvIdQuery"
      (input)="applyFilters()"
      [ngModelOptions]="{standalone: true}" />
  </div>
</div>



  <!-- 🧾 Formulaire de rappel -->
  <div class="card shadow-sm p-3" style="min-width: 280px;">
    <h5 class="mb-3">🔔 Rappel</h5>
    <form #rappelForm="ngForm" (ngSubmit)="envoyerRappel()">

      <div class="mb-2">
        <label class="form-label">ID Rendez-vous</label>
        <input type="number" class="form-control" name="idRdv" [(ngModel)]="rappel.idRdv" required>
      </div>

      <div class="mb-2">
        <label class="form-label">ID Patient</label>
        <input type="number" class="form-control" name="idPatient" [(ngModel)]="rappel.idPatient" required>
      </div>

      <div class="mb-2">
        <label class="form-label">Nombre de tentatives</label>
        <input type="number" class="form-control" name="tentatives" [(ngModel)]="rappel.tentatives" readonly>
      </div>

      <div class="mb-2">
        <label class="form-label">Motif de rappel</label>
        <select class="form-select" name="motifRappel" [(ngModel)]="rappel.motifRappel" required>
          <option value="mail">Mail</option>
          <option value="sms">SMS</option>
          <option value="telephone">Téléphone</option>
        </select>
      </div>

      <!-- Si le motif est "téléphone", on affiche le sous-motif -->
      <div class="mb-2" *ngIf="rappel.motifRappel === 'telephone'">
        <label class="form-label">Motif de retour</label>
        <select class="form-select" name="motifRetour" [(ngModel)]="rappel.motifRetour">
          <option value="occupé">Occupé</option>
          <option value="appel_manque">Appel manqué</option>
          <option value="appel_recu">Appel reçu</option>
        </select>
      </div>

      <div class="mt-3 d-flex justify-content-between">
        <button type="button" class="btn btn-outline-primary btn-sm" (click)="incrementTentative()">🔁 Rappel</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" (click)="resetRappelForm()">Réinitialiser</button>
        <button type="submit" class="btn btn-success btn-sm">Enregistrer</button>
      </div>
    </form>
  </div>

</div>


  <!-- Formulaire ajout -->
  <div class="card mb-4 shadow-sm rounded-3">
    <div class="card-header bg-light">
      <h5 class="mb-0">➕ Ajouter un rendez-vous</h5>
    </div>
    <div class="card-body">
      <form #addForm="ngForm" (ngSubmit)="create()" novalidate>
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label">ID *</label>
            <input type="number" class="form-control" name="id" [(ngModel)]="newRendezVous.id" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Patient *</label>
            <input type="number" class="form-control" name="idDimPatient" [(ngModel)]="newRendezVous.idDimPatient" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Date prévisionnelle *</label>
            <input type="date" class="form-control" name="datePrevisionnelle" [(ngModel)]="newRendezVous.datePrevisionnelle" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Heure prévisionnelle *</label>
            <input type="time" class="form-control" name="heurePrevisionnelle" [(ngModel)]="newRendezVous.heurePrevisionnelle" required>
          </div>
        </div>

        <div class="row g-3 mt-2">
          <div class="col-md-12">
            <label class="form-label">Commentaires</label>
            <input type="text" class="form-control" name="commentaires" [(ngModel)]="newRendezVous.commentaires">
          </div>
        </div>

        <div class="mt-3 text-end">
          <button type="submit" class="btn btn-success" [disabled]="addForm.invalid">Ajouter</button>
          <button type="button" class="btn btn-outline-secondary ms-2" (click)="resetAddForm(addForm)">Réinitialiser</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Liste RDV sous forme de cartes -->
 <div class="row">
  <div class="col-md-4 mb-3" *ngFor="let rdv of filteredRendezVous">
    <div class="card shadow-sm p-3 h-100">

      <h5 class="card-title">Rendez-vous #{{ rdv.idFactPriseRendezVous }} - Patient #{{ rdv.idDimPatient }}</h5>

      <!-- FORMULAIRE EDITION INLINE -->
      <form *ngIf="editingRendezVousId === rdv.idFactPriseRendezVous"
            (ngSubmit)="update()" #editForm="ngForm">

        <div class="mb-2">
          <label>Date :</label>
          <input type="date" class="form-control"
                 [(ngModel)]="editingRendezVous!.datePrevisionnelle"
                 name="editDate{{rdv.idFactPriseRendezVous}}" required>
        </div>

        <div class="mb-2">
          <label>Heure :</label>
          <input type="time" class="form-control"
                 [(ngModel)]="editingRendezVous!.heurePrevisionnelle"
                 name="editHeure{{rdv.idFactPriseRendezVous}}" required>
        </div>

        <div class="mb-2">
          <label>Commentaires :</label>
          <input type="text" class="form-control"
                 [(ngModel)]="editingRendezVous!.commentaires"
                 name="editCommentaires{{rdv.idFactPriseRendezVous}}">
        </div>

        <div class="d-flex justify-content-between mt-2">
          <button type="submit" class="btn btn-success btn-sm">Enregistrer</button>
          <button type="button" class="btn btn-secondary btn-sm" (click)="cancelEdit()">Annuler</button>
        </div>
      </form>

      <!-- MODE AFFICHAGE -->
      <div *ngIf="editingRendezVousId !== rdv.idFactPriseRendezVous">
        <p><b>Date :</b> {{ rdv.datePrevisionnelle }}</p>
        <p><b>Heure :</b> {{ rdv.heurePrevisionnelle }}</p>
        <p><b>Commentaires :</b> {{ rdv.commentaires || '-' }}</p>

        <div class="d-flex justify-content-between mt-2">
          <button class="btn btn-warning btn-sm" (click)="edit(rdv)">Modifier</button>
          <button class="btn btn-danger btn-sm" (click)="confirmDelete(rdv.idFactPriseRendezVous)">Supprimer</button>
        </div>
      </div>

    </div>
  </div>
</div>
